name: A2A client cancellation presubmit
run-name: A2A Python 3.10 tests for d374ecd8
on:
  push:
    branches: ["codex-ci/a2a-client-cancellation-ce6db104"]
permissions:
  contents: read
jobs:
  presubmit:
    if: github.repository == 'GoldArowana/a2a-python' && github.ref == 'refs/heads/codex-ci/a2a-client-cancellation-ce6db104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: d374ecd8bb914804f1ffd6040db6a9243bfb6896
      EXPECTED_TREE: a5e8f203c12c20ece8c02df6a42c3e9bdd5a21e2
      UV_NO_CACHE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d374ecd8bb914804f1ffd6040db6a9243bfb6896
          persist-credentials: false
      - name: Check candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff HEAD --exit-code
          printf 'tested_head=%s tested_tree=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE"
      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: '3.10'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run upstream lint and type checks
        run: |
          ./scripts/lint.sh
          git diff HEAD --exit-code
      - name: Run upstream Python tests
        run: uv run pytest
      - name: Run upstream coverage checks
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=88
      - name: Check candidate source remained unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff HEAD --exit-code
